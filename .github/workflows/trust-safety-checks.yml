name: Trust and safety regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate trust and safety foundation
        run: node scripts/check-trust-safety.mjs
