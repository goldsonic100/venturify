name: Trust and safety regression checks

on:
  pull_request:
    paths:
      - 'scripts/check-trust-safety.mjs'
      - 'scripts/trust-safety.js'
      - 'moderator.html'
      - 'supabase/migrations/20261016000000_add_trust_safety_foundation.sql'
      - 'supabase/migrations/20261017000000_enforce_user_blocks.sql'
      - 'supabase/migrations/20261018150000_add_moderator_review_workflow.sql'
      - 'supabase/migrations/20261018160000_add_moderator_dashboard.sql'
      - 'supabase/migrations/20261018170000_paginate_moderator_reports.sql'
      - 'supabase/migrations/20261019030000_harden_blocked_conversation_metadata.sql'
      - 'supabase/migrations/20261019040000_fix_blocked_read_receipt_insert.sql'
      - 'supabase/migrations/20261019050000_validate_workspace_task_assignees.sql'
      - '.github/workflows/trust-safety-checks.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/check-trust-safety.mjs'
      - 'scripts/trust-safety.js'
      - 'moderator.html'
      - 'supabase/migrations/20261016000000_add_trust_safety_foundation.sql'
      - 'supabase/migrations/20261017000000_enforce_user_blocks.sql'
      - 'supabase/migrations/20261018150000_add_moderator_review_workflow.sql'
      - 'supabase/migrations/20261018160000_add_moderator_dashboard.sql'
      - 'supabase/migrations/20261018170000_paginate_moderator_reports.sql'
      - 'supabase/migrations/20261019030000_harden_blocked_conversation_metadata.sql'
      - 'supabase/migrations/20261019040000_fix_blocked_read_receipt_insert.sql'
      - 'supabase/migrations/20261019050000_validate_workspace_task_assignees.sql'
      - '.github/workflows/trust-safety-checks.yml'

permissions:
  contents: read

jobs:
  trust-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate trust and safety foundation and block enforcement
        run: node scripts/check-trust-safety.mjs
