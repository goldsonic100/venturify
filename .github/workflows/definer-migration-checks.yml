name: SECURITY DEFINER migration regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  definer-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check SECURITY DEFINER search_path settings
        run: node scripts/check-definer-migrations.mjs
