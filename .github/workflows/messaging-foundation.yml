name: Messaging end-to-end foundation checks
on:
  push:
    branches: [main, feat/messaging-end-to-end-notifications]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  messaging-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-messaging-foundation.mjs
      - run: node scripts/check-messaging-block-policies.mjs
