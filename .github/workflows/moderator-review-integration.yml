name: Moderator report review integration tests

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261018150000_add_moderator_review_workflow.sql'
      - 'supabase/tests/moderator-review-fixture.sql'
      - 'supabase/tests/moderator-review-integration.sql'
      - '.github/workflows/moderator-review-integration.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261018150000_add_moderator_review_workflow.sql'
      - 'supabase/tests/moderator-review-fixture.sql'
      - 'supabase/tests/moderator-review-integration.sql'
      - '.github/workflows/moderator-review-integration.yml'

permissions:
  contents: read

jobs:
  moderator-review:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: venturify_moderator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venturify_moderator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable moderator fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d venturify_moderator_test -v ON_ERROR_STOP=1 -f supabase/tests/moderator-review-fixture.sql
      - name: Apply migration and verify authorization boundaries
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d venturify_moderator_test -v ON_ERROR_STOP=1 -f supabase/tests/moderator-review-integration.sql
