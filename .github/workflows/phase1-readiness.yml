name: Phase 1 release readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-page-checks:
    name: Core page regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Phase 1 pages
        run: node scripts/check-phase1-readiness.mjs
      - name: Validate Phase 1 functional contracts
        run: node scripts/check-phase1-functional-contracts.mjs
      - name: Validate security smoke-test contract
        run: node scripts/check-security-smoke-contracts.mjs
      - name: Validate messaging-privacy contract
        run: node scripts/check-messaging-contracts.mjs
      - name: Validate settings-persistence contract
        run: node scripts/check-settings-contracts.mjs
      - name: Validate discover-eligibility contract
        run: node scripts/check-discover-eligibility.mjs
