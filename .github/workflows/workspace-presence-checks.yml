name: Workspace presence regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace-presence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate private workspace presence
        run: node scripts/check-workspace-presence.mjs
