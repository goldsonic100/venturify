name: Messaging and collaboration regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  messaging-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check messaging and collaboration
        run: node scripts/check-messaging-collaboration.mjs
