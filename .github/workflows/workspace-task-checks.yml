name: Workspace task integrity regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate workspace task integrity
        run: node scripts/check-workspace-tasks.mjs
