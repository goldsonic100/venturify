name: Notification center regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate notification feed and read-state access
        run: node scripts/check-notifications.mjs
