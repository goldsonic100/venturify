name: Account settings security regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  account-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate persisted preferences and database enforcement
        run: node scripts/check-account-settings.mjs
