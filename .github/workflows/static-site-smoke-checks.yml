name: Static site smoke checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compile inline JavaScript in every root HTML page
        run: node scripts/validate-static-site.mjs
      - name: Check collaboration notification and deep-link invariants
        run: node scripts/check-workspace-notifications.mjs
      - name: Check global Settings and Account navigation
        run: node scripts/check-global-account-navigation.mjs
      - name: Check dedicated community pages and feed controls
        run: node scripts/check-community-page.mjs
      - name: Check shared directory sorting and persisted preferences
        run: node scripts/check-directory-sorting.mjs
      - name: Check people and follower directory sorting
        run: node scripts/check-people-directory-sorting.mjs
