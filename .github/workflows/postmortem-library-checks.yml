name: Founder post-mortem library checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postmortem-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate post-mortem library privacy and UI contracts
        run: node scripts/check-postmortem-library.mjs
