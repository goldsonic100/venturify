name: Profile and feed regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  profile-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate profile and feed safeguards
        run: node scripts/check-profile-feed.mjs
