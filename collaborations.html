<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a16">
<title>Collaborations — Venturify</title>
<style>
:root{--ink:#15221c;--muted:#68766c;--paper:#f5f6ef;--card:#fffefa;--line:#dfe5d9;--green:#31583a;--lime:#c8f169}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}header{background:#101a16;color:#fff;padding:15px 20px}nav{max-width:920px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}nav>div{display:flex;align-items:center;gap:15px;flex-wrap:wrap}nav a{color:white;font-size:12px}nav a:hover{color:var(--lime)}.wrap{width:min(920px,calc(100% - 28px));margin:32px auto 60px}.kicker{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#71816f;font-weight:850}h1{font:500 clamp(32px,5vw,46px)/1.1 Georgia,serif;margin:8px 0}.muted{color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:15px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.request-tools{display:flex;gap:9px;flex-wrap:wrap;margin:-7px 0 15px}.request-tools input,.request-tools select{min-height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:9px 12px;font:inherit;font-size:12px}.request-tools input{flex:1;min-width:220px}.request-tools select{min-width:145px}.tab,.btn{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#fff;color:var(--ink);font-size:11px;font-weight:800;cursor:pointer}.tab.active{background:#eaf2e5;border-color:#b7cba9;color:var(--green)}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn:disabled{opacity:.55;cursor:wait}.request{padding:16px 0;border-top:1px solid #e8ece4}.request:first-child{border-top:0;padding-top:2px}.request-head{display:flex;align-items:flex-start;gap:11px}.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;background:#eaf2e5;color:var(--green);font-weight:850;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.request-main{flex:1;min-width:0}.request-title{font-size:13px;font-weight:850}.request-sub{font-size:11px;color:var(--muted);margin-top:2px}.status{display:inline-flex;border-radius:99px;padding:4px 8px;background:#edf2e7;color:#4e6c4e;font-size:10px;font-weight:850;text-transform:capitalize;white-space:nowrap}.status.pending{background:#fff4df;color:#875a08}.status.declined{background:#fff0ed;color:#9d3930}.message{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f7f1;border-radius:9px;padding:12px;margin:12px 0;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:12px}.notice{padding:12px;border-radius:9px;background:#edf3e7;color:#31583a;font-size:12px;margin:14px 0}.notice.error{background:#fff0ed;color:#9d3930}.hidden{display:none!important}@media(max-width:540px){.card{padding:14px}.request-head{gap:8px}.status{font-size:9px}.wrap{margin-top:23px}.request-tools{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}.request-tools input,.request-tools select{width:100%;min-width:0}.request-tools .btn{width:100%;min-height:42px}.tabs .tab{flex:1 1 auto;min-height:40px}.request-head{flex-wrap:wrap}.request-head .status{margin-left:auto}.actions .btn{min-height:40px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script id="venturify-global-theme">
(function(){
 const key='venturify-theme';
 function apply(theme){
  const actual=theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme;
  document.documentElement.dataset.theme=actual;
  document.documentElement.style.colorScheme=actual;
  let style=document.getElementById('venturify-theme-overrides');
  if(!style){style=document.createElement('style');style.id='venturify-theme-overrides';document.head.appendChild(style)}
  style.textContent=actual==='dark'?`
   :root{--paper:#0b1220;--card:#111c2e;--ink:#e7edf7;--muted:#9baac0;--line:#29384d;--deep:#08101c;--accent:#3985ff}
   body{background:#0b1220!important;color:#e7edf7!important}
   .topbar,header.topbar,.nav,.site-header{background:#08101c!important;color:#eef4ff!important;border-color:#29384d!important}
   .card,.panel,.surface,.modal,.dropdown,.community-card,.post-card,.message-panel,.conversation-list,.chat-panel,.settings-card{background:#111c2e!important;color:#e7edf7!important;border-color:#29384d!important}
   input,textarea,select{background:#111c2e!important;color:#e7edf7!important;border-color:#35465f!important}
   p,small,.muted,.muted-small,.subtitle,.description{color:#a8b6ca}
   a{color:#8ab8ff}
  `:`
   :root{--paper:#f5f7fb;--card:#fff;--ink:#182337;--muted:#63718a;--line:#dbe3ee;--deep:#f0f4fa;--accent:#1769e0}
   body{background:#f5f7fb!important;color:#182337!important}
   .topbar,header.topbar,.nav,.site-header{background:#fff!important;color:#182337!important;border-color:#dbe3ee!important}
   .card,.panel,.surface,.modal,.dropdown,.community-card,.post-card,.message-panel,.conversation-list,.chat-panel,.settings-card{background:#fff!important;color:#182337!important;border-color:#dbe3ee!important}
   input,textarea,select{background:#fff!important;color:#182337!important;border-color:#cbd5e1!important}
   p,small,.muted,.muted-small,.subtitle,.description{color:#63718a}
   a{color:#1769e0}
  `;
 }
 let initial=localStorage.getItem(key)||'system';
 try{const raw=localStorage.getItem('supabase.auth.token');if(raw){const parsed=JSON.parse(raw);const token=parsed?.currentSession?.user?.id;if(token){}}}catch(e){}
 apply(initial);
 window.addEventListener('storage',e=>{if(e.key===key)apply(e.newValue||'system')});
 const media=window.matchMedia('(prefers-color-scheme: dark)');
 if(media.addEventListener)media.addEventListener('change',()=>{if((localStorage.getItem(key)||'system')==='system')apply('system')});
 window.venturifyApplyTheme=apply;
})();
</script> <link rel="stylesheet" href="venturify-ui.css">
  <link rel="stylesheet" href="assets/venturify-design-system.css">
</head>
<body>
<header><nav><a href="index.html"><strong>VENTURIFY</strong></a><div><a href="discover.html">Discover</a><a href="feed.html">Feed</a><a href="messages.html">Messages</a><a href="workspace.html">Workspaces</a><a href="profile.html">Profile</a></div></nav></header>
<main class="wrap"><div class="kicker">Build together</div><h1>Collaboration requests</h1><p class="muted">Keep track of founders who want to build with you, requests you have sent, and accepted collaborations.</p>
<div id="notice" class="notice">Checking your account…</div>
<div id="app" class="hidden"><div class="tabs" role="group" aria-label="Filter collaboration requests"><button class="tab active" data-filter="all">All requests</button><button class="tab" data-filter="incoming">Received</button><button class="tab" data-filter="outgoing">Sent</button></div><div class="request-tools"><input id="requestSearch" type="search" placeholder="Search founders or messages…" aria-label="Search collaboration requests"><select id="statusFilter" aria-label="Filter by request status"><option value="all">Every status</option><option value="pending">Pending</option><option value="accepted">Accepted</option><option value="declined">Declined</option></select><select id="requestSort" aria-label="Sort collaboration requests"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="founder">Founder name A–Z</option></select><button id="exportRequests" class="btn" type="button">Export CSV</button></div><section class="card"><div id="summary" class="muted" aria-live="polite" aria-atomic="true" style="margin-bottom:12px"></div><div id="requests" role="region" aria-label="Collaboration request results" aria-live="polite" aria-relevant="additions text" aria-busy="true"><div class="empty">Loading requests…</div></div></section></div>
</main>
<script>
(()=> {
 const client=window.venturifySupabaseClient||window.supabase.createClient('https://edyssdvytwdvpqkmalow.supabase.co','sb_publishable_Gsv129_4tDStH7xzeirfAQ_LJ8ZSv1W');
 const $=id=>document.getElementById(id);
 const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
 const initials=v=>(String(v||'V').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('')||'V').toUpperCase();
 let user=null,requests=[],profiles=new Map(),filter='all',statusFilter='all',searchTerm='',requestSort='newest',busy=false;
 function notice(message,error=false){$('notice').textContent=message;$('notice').classList.toggle('error',error);$('notice').classList.remove('hidden')}
 function date(v){try{return new Date(v).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}catch{return ''}}
 function render(){
  $('requests').setAttribute('aria-busy','false');
  const filtered=requests.filter(r=>(filter==='all'||(filter==='incoming'?r.recipient_id===user.id:r.requester_id===user.id))&&(statusFilter==='all'||r.status===statusFilter)&&(!searchTerm||((profiles.get(r.requester_id===user.id?r.recipient_id:r.requester_id)?.display_name||'')+' '+(profiles.get(r.requester_id===user.id?r.recipient_id:r.requester_id)?.username||'')+' '+(r.message||'')).toLowerCase().includes(searchTerm))).sort((a,b)=>requestSort==='oldest'?new Date(a.created_at)-new Date(b.created_at):requestSort==='founder'?((profiles.get(a.requester_id===user.id?a.recipient_id:a.requester_id)?.display_name||profiles.get(a.requester_id===user.id?a.recipient_id:a.requester_id)?.username||'').localeCompare(profiles.get(b.requester_id===user.id?b.recipient_id:b.requester_id)?.display_name||profiles.get(b.requester_id===user.id?b.recipient_id:b.requester_id)?.username||'')):new Date(b.created_at)-new Date(a.created_at));
  const pendingIn=requests.filter(r=>r.recipient_id===user.id&&r.status==='pending').length;
  $('summary').textContent=requests.length+' total · '+pendingIn+' awaiting your response · '+requests.filter(r=>r.status==='accepted').length+' accepted';
  $('requests').innerHTML=filtered.map(r=>{
   const incoming=r.recipient_id===user.id,otherId=incoming?r.requester_id:r.recipient_id,p=profiles.get(otherId)||{},name=p.display_name||('@'+(p.username||'founder')),avatar=p.avatar_url&&/^https?:\/\//i.test(p.avatar_url)?'<img src="'+esc(p.avatar_url)+'" alt="">':esc(initials(name));
   const status=['pending','accepted','declined'].includes(r.status)?r.status:'unknown';
   return '<article class="request"><div class="request-head"><div class="avatar">'+avatar+'</div><div class="request-main"><div class="request-title">'+(incoming?'Request from ':'Request to ')+esc(name)+'</div><div class="request-sub">'+(p.username?'@'+esc(p.username)+' · ':'')+esc(date(r.created_at))+'</div></div><span class="status '+esc(status)+'">'+esc(status)+'</span></div><div class="message">'+esc(r.message)+'</div><div class="actions">'+(incoming&&status==='pending'?'<button class="btn primary" data-decision="accepted" data-id="'+esc(r.id)+'">Accept &amp; create workspace</button><button class="btn" data-decision="declined" data-id="'+esc(r.id)+'">Decline</button>':'')+(!incoming&&status==='pending'?'<button class="btn" data-withdraw="'+esc(r.id)+'">Withdraw request</button>':'')+(status==='accepted'?'<a class="btn primary" href="workspace.html?request='+encodeURIComponent(r.id)+'">Open workspace</a>':'')+(incoming?'<a class="btn" href="messages.html?to='+encodeURIComponent(r.requester_id)+'">Message founder</a>':'')+'</div></article>';
  }).join('')||'<div class="empty">'+(searchTerm||statusFilter!=='all'?'No requests match these search filters.':filter==='incoming'?'No requests received yet.':filter==='outgoing'?'You have not sent any collaboration requests yet.':'No collaboration requests yet. Find an opportunity in the feed to get started.')+'</div>';
  document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',String(b.dataset.filter===filter))});
 }
 async function load(){
  if(busy)return;busy=true;
  const auth=await client.auth.getUser();user=auth.data?.user||null;
  if(!user){busy=false;$('app').classList.add('hidden');notice('Log in to view your collaboration requests. Open the Feed or Discover page to sign in.',true);return}
  const result=await client.from('collaboration_requests').select('id,requester_id,recipient_id,message,status,created_at,updated_at').or('requester_id.eq.'+user.id+',recipient_id.eq.'+user.id).order('created_at',{ascending:false}).limit(100);
  if(result.error){busy=false;notice('Could not load collaboration requests. Please refresh and try again.',true);return}
  requests=result.data||[];
  const ids=[...new Set(requests.flatMap(r=>[r.requester_id,r.recipient_id]).filter(id=>id!==user.id))];
  if(ids.length){const pr=await client.from('profiles').select('id,username,display_name,avatar_url').in('id',ids);if(!pr.error)profiles=new Map((pr.data||[]).map(p=>[p.id,p]))}
  busy=false;$('app').classList.remove('hidden');$('notice').classList.add('hidden');render();
 }
 document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));
 $('requestSearch').addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();render()});
 $('statusFilter').addEventListener('change',e=>{statusFilter=e.target.value;render()});$('requestSort').addEventListener('change',e=>{requestSort=e.target.value;render()});
 $('exportRequests').addEventListener('click',()=>{
  const csvCell=value=>'"'+String(value??'').replace(/"/g,'""')+'"';
  const rows=[['Request ID','Direction','Founder','Username','Message','Status','Created','Updated']];
  requests.forEach(r=>{const incoming=r.recipient_id===user.id,otherId=incoming?r.requester_id:r.recipient_id,p=profiles.get(otherId)||{};rows.push([r.id,incoming?'Received':'Sent',p.display_name||p.username||'Founder',p.username||'',r.message||'',r.status,date(r.created_at),date(r.updated_at)]);});
  const csv='\\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\\r\\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');
  a.href=url;a.download='venturify-collaboration-requests.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  notice('Exported '+requests.length+' collaboration request'+(requests.length===1?'':'s')+'.');
 });
 $('requests').addEventListener('click',async e=>{
  const withdraw=e.target.closest('[data-withdraw]');if(withdraw&&user){const id=withdraw.dataset.withdraw;if(!confirm('Withdraw this pending collaboration request?'))return;withdraw.disabled=true;const removed=await client.from('collaboration_requests').delete().eq('id',id).eq('requester_id',user.id).eq('status','pending').select('id').maybeSingle();if(removed.error||!removed.data){withdraw.disabled=false;notice('Could not withdraw this request. It may already have been handled.',true);return}requests=requests.filter(r=>r.id!==id);render();notice('Collaboration request withdrawn.');return}
  const b=e.target.closest('[data-decision]');if(!b||!user)return;
  const id=b.dataset.id,status=b.dataset.decision;if(!['accepted','declined'].includes(status))return;
  b.disabled=true;
  const result=await client.from('collaboration_requests').update({status,updated_at:new Date().toISOString()}).eq('id',id).eq('recipient_id',user.id).eq('status','pending').select('id').maybeSingle();
  if(result.error||!result.data){b.disabled=false;notice('This request could not be updated. It may already have been handled.',true);return}
  await load();
  if(status==='accepted')window.location.href='workspace.html?request='+encodeURIComponent(id);
 });
 let requestChannel=null;
 function startRealtime(){if(!user||requestChannel)return;requestChannel=client.channel('collaboration-requests-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'collaboration_requests',filter:'recipient_id=eq.'+user.id},()=>{load().catch(()=>{})}).on('postgres_changes',{event:'*',schema:'public',table:'collaboration_requests',filter:'requester_id=eq.'+user.id},()=>{load().catch(()=>{})}).subscribe()}
 client.auth.onAuthStateChange(()=>setTimeout(()=>{requestChannel=null;load().then(startRealtime).catch(()=>{})},0));
 load().then(startRealtime).catch(()=>{busy=false;notice('Something went wrong loading collaboration requests.',true)});
})();
</script>
<script>
(function(){
 const header=document.querySelector('header.topbar');
 if(!header||header.querySelector('[data-global-settings-link]'))return;
 const link=document.createElement('a');link.href='settings.html';link.dataset.globalSettingsLink='true';link.setAttribute('aria-label','Settings');link.title='Settings';link.textContent='⚙';
 Object.assign(link.style,{display:'grid',placeItems:'center',width:'40px',height:'40px',flex:'0 0 40px',border:'1px solid #607165',borderRadius:'9px',color:'#c8f169',fontSize:'22px',lineHeight:'1',marginLeft:'12px',background:'transparent'});
 header.appendChild(link);
})();
</script>
